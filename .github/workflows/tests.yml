name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # The sealed-lineage suites under research/extensions/ are named *_tests.py, so the
      # default collection above skips them. These three need no git-ignored data. The
      # others (f6, vrp, ta, ca, x01 construction/contract/execution) read git-ignored
      # vendor data (data/close_prices_raw.csv, data/vix/, FRED files) or the sibling
      # commodity-carry-research checkout, so they cannot run on a clean clone.
      - name: Run extension suites that need no git-ignored data
        run: >-
          pytest -q
          research/extensions/benb/benb_tests.py
          research/extensions/value/value_tests.py
          research/extensions/x01/x01_inference_tests.py
