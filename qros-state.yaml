# Recorded here and in `session_log[]` for the same reason the Wave-0
# authorization is: `human_decisions[]` is a closed three-token vocabulary and
# an authorization is none of those tokens.
#
# CORRECTION, authorized by Aaron on 2026-09-10: that D declaration was
