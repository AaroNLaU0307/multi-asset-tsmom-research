# lane: FULL | MEASUREMENT | EXPLORATORY, closed at three, "Never inferred"
# (2.4).
#
# DECLARED BY AARON. Basis: his Wave-1 routing header declares
# `LANE = MEASUREMENT`, and his permit list authorizes "governance state
# transitions that are canonically required and legally supported". Lane
# declarations sit in 4.1's Authority row, so this records HIS act.
#
# WAS EXPLORATORY at Wave 0. Why it had to change: QROS 1 fixes lane semantics
# as WHICH CLAIMS THE WORK MAY EMIT. EXPLORATORY emits hypotheses and leads;
# MEASUREMENT emits implementation facts, structural findings and premise
# results. Every Wave-1 item authorized -- X07, X45, X46, X02a,
# X03-structural, X05 -- is labelled `Lane: MEASUREMENT` in MAP_v2. Emitting
# them under EXPLORATORY would emit claims the declared lane does not license.
#
# ORDER MATTERS, and was verified against the runtime before use: the
# MEASUREMENT chain is C -> D -> E -> F -> L and contains NO stage A. Declaring
# this lane while still at stage A renders "no transition leaves stage A in the
# MEASUREMENT chain" -- a dead end. So A -> C was taken on the EXPLORATORY
# chain first (a real edge, reported ELIGIBLE), and the lane declared after.
# See research/extensions/wave1/WAVE1_PREFLIGHT.md section 4.
lane: "FULL"

# workflow_stage: A A2 B C D E F G H I J K L, closed (2.5). The stage
# currently DUE OR IN PROGRESS -- not a status, not a verdict.
#
# DECLARED BY THE WORKING SESSION. 4.1's Authority row does not contain
# `workflow_stage`, and 10.2 makes DECLARED a working-session self-report, so
# it is mine to state and Aaron's to correct.
#
# C (build). Declared D on 2026-09-10 under Aaron's explicit `QROS C -> D
# TRANSITION` authorization, then CORRECTED BACK TO C on 2026-09-10 under
# Aaron's explicit correction authorization, because a pre-evidence
# completeness check run after that transition established that the
# statistics/inference portion of Stage C had never been built.
#
# The transition was mechanically legal -- the runtime reported
# `C -> D = ELIGIBLE` and state legality passed -- and it was still premature.
# The runtime evaluates NO build-completeness precondition for `C -> D`
# (`TBL-PRECONDITIONS` has no row for that edge and none of the three closed
# sets in 2.6(c) contains it), so ELIGIBLE could not and did not mean the build
# was finished. The producing session did not check that separately before
# declaring D; this correction is the consequence.
#
# Per QROS §3 the stages mean: C = Build (pipeline, strategy, statistics,
# tests); D = Mechanical verify (invariants, leakage, timestamps, train/test
# separation, accounting identities, deterministic reproduction).
#
# The honest description of where the project is: the CONSTRUCTION half of the
# build is complete -- independently accepted, frozen at
# 851e9d3fd8d23c2f6802f796fcc32a21c5bd5a70 and mechanically bound, and that
# acceptance is NOT withdrawn by this correction. The STATISTICS half is not.
# QROS 3 defines C as "Build -- pipeline, strategy, statistics, tests", and the
# sealed inference layer (Sharpe(E)/Sharpe(F), dS, the paired joint stationary
# bootstrap, invalid-replicate handling, the percentile CI, the classification
# against -B, the S1/S2 descriptive arms, the crisis windows and the path
# diagnostics) had no implementation at all. C is therefore the correct stage
# and remains so until that build is complete and independently accepted.
#
# `workflow_stage` is a single scalar for the whole project, so it cannot say
# "construction verified, inference unbuilt". Where the two halves disagree the
# EARLIER stage is the truthful declaration.
#
# D IS NOT EVIDENCE. QROS §3 puts "run the preregistered study" at stage E, so
# no X01 target series, Sharpe, delta-Sharpe, bootstrap or crisis statistic may
# be produced at D. `execution_authorized` stays false and `execute` still
# refuses; this transition authorized neither.
#
# Recorded consequence, not hidden: §2.6(c) puts every edge whose tail stage is
# at or after D in the OUTCOME-BEARING SET. Declaring C rather than D therefore
# does not merely relabel the project -- it moves it back out of the region
# where the next edge could generate an outcome, which is the correct posture
# while the study that would produce that outcome does not exist.
workflow_stage: "C"

